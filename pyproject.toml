[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-language"
version = "0.1.0"
description = "Transparent examples connecting delta/gamma with DV01/convexity"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
risk-language = "risk_language.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
